<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #board {
      display: block;
      background: #0b0f0e;
      border: 1px solid var(--line);
      border-radius: 4px;
      touch-action: none;
      max-width: 100%;
    }
    .hud {
      display: flex;
      gap: 24px;
      font-size: 17px;
      color: var(--muted);
    }
    .hud strong {
      color: var(--heading);
      font-weight: 600;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(3, 64px);
      gap: 6px;
    }
    .pad button {
      font: inherit;
      font-size: 22px;
      background: transparent;
      color: var(--heading);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .pad button:active {
      background: var(--line);
    }
    .pad .blank {
      visibility: hidden;
    }
    .pad .pause {
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Snake</h1>
  <p>Eat, grow, don't hit the wall.</p>
</header>

<main>

  <a class="back-link" href="index.html">Back to games</a>

  <div class="game-wrap">
    <canvas id="board" aria-label="Snake game board"></canvas>

    <div class="hud">
      <span>Score <strong id="score">0</strong></span>
      <span>Best <strong id="best">0</strong></span>
    </div>

    <div class="pad">
      <div class="blank"></div>
      <button type="button" data-x="0" data-y="-1" aria-label="Up">&uarr;</button>
      <div class="blank"></div>
      <button type="button" data-x="-1" data-y="0" aria-label="Left">&larr;</button>
      <button type="button" class="pause" id="pause" aria-label="Pause or play">Pause</button>
      <button type="button" data-x="1" data-y="0" aria-label="Right">&rarr;</button>
      <div class="blank"></div>
      <button type="button" data-x="0" data-y="1" aria-label="Down">&darr;</button>
      <div class="blank"></div>
    </div>
  </div>

</main>

<script>
  (function () {
    const COLS = 20;
    const ROWS = 20;
    const TICK = 120;

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const pauseBtn = document.getElementById('pause');

    let size = 0;
    let dpr = 1;
    let cell = 0;

    let snake, dir, nextDir, food;
    let score = 0;
    let best = 0;
    let running = false;
    let started = false;
    let over = false;
    let timer = null;

    try {
      best = parseInt(localStorage.getItem('snakeBest'), 10) || 0;
    } catch (e) {
      best = 0;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      size = Math.floor(Math.min(420, window.innerWidth - 40));
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      canvas.width = Math.floor(size * dpr);
      canvas.height = Math.floor(size * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cell = size / COLS;
      draw();
    }

    function placeFood() {
      let f;
      do {
        f = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === f.x && s.y === f.y));
      return f;
    }

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      food = placeFood();
      over = false;
      running = false;
      started = false;
      clearInterval(timer);
      timer = null;
      updateHud();
      draw();
    }

    function begin() {
      if (over) reset();
      running = true;
      started = true;
      if (!timer) timer = setInterval(step, TICK);
      updateHud();
      draw();
    }

    function togglePause() {
      if (!started || over) return;
      running = !running;
      updateHud();
      draw();
    }

    function endGame() {
      running = false;
      over = true;
      clearInterval(timer);
      timer = null;
      if (score > best) {
        best = score;
        try {
          localStorage.setItem('snakeBest', best);
        } catch (e) {}
      }
      updateHud();
      draw();
    }

    function step() {
      if (!running) return;
      dir = nextDir;
      const head = snake[0];
      const nx = head.x + dir.x;
      const ny = head.y + dir.y;
      const hitWall = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
      const hitSelf = snake.some(s => s.x === nx && s.y === ny);
      if (hitWall || hitSelf) {
        endGame();
        return;
      }
      snake.unshift({ x: nx, y: ny });
      if (nx === food.x && ny === food.y) {
        score++;
        food = placeFood();
      } else {
        snake.pop();
      }
      updateHud();
      draw();
    }

    function setDir(dx, dy) {
      if (!started || over) begin();
      if (dx === -dir.x && dy === -dir.y) return;
      nextDir = { x: dx, y: dy };
    }

    function updateHud() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
      pauseBtn.textContent = running ? 'Pause' : 'Play';
    }

    function draw() {
      if (!snake || !size) return;

      ctx.fillStyle = '#0b0f0e';
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = 'rgba(44, 77, 65, 0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= COLS; x++) {
        ctx.moveTo(x * cell, 0);
        ctx.lineTo(x * cell, size);
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.moveTo(0, y * cell);
        ctx.lineTo(size, y * cell);
      }
      ctx.stroke();

      ctx.fillStyle = '#c39bbd';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.35, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#a3b98a' : '#7f9686';
        ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
      });

      if (!running) {
        ctx.fillStyle = 'rgba(14, 18, 17, 0.7)';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#a3b98a';
        ctx.font = '20px Newsreader, Georgia, serif';
        ctx.textAlign = 'center';
        if (over) {
          ctx.fillText('Game over', size / 2, size / 2 - 8);
          ctx.fillStyle = '#7f9686';
          ctx.font = '16px Newsreader, Georgia, serif';
          ctx.fillText('Tap or press a key to play again', size / 2, size / 2 + 20);
        } else if (started) {
          ctx.fillText('Paused', size / 2, size / 2);
        } else {
          ctx.fillText('Press an arrow key or tap to start', size / 2, size / 2);
        }
      }
    }

    const KEYS = {
      ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
      ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
      ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
    };

    document.addEventListener('keydown', e => {
      if (KEYS[e.key]) {
        e.preventDefault();
        setDir(KEYS[e.key][0], KEYS[e.key][1]);
      } else if (e.key === ' ' || e.key === 'p' || e.key === 'P' || e.key === 'Enter') {
        e.preventDefault();
        if (!started || over) begin();
        else togglePause();
      }
    });

    // Swipe on the board, or tap to start and pause.
    let touchX = 0;
    let touchY = 0;

    canvas.addEventListener('touchstart', e => {
      const t = e.touches[0];
      touchX = t.clientX;
      touchY = t.clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const t = e.changedTouches[0];
      const dx = t.clientX - touchX;
      const dy = t.clientY - touchY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) {
        if (!started || over) begin();
        else togglePause();
        return;
      }
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
    }, { passive: false });

    canvas.addEventListener('click', () => {
      if (!started || over) begin();
      else togglePause();
    });

    // On-screen buttons.
    document.querySelectorAll('.pad button[data-x]').forEach(btn => {
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        setDir(parseInt(btn.dataset.x, 10), parseInt(btn.dataset.y, 10));
      });
    });

    pauseBtn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!started || over) begin();
      else togglePause();
    });

    // Pause when the tab is hidden.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && running) togglePause();
    });

    window.addEventListener('resize', resize);

    resize();
    reset();
    bestEl.textContent = best;
  })();
</script>

</body>
</html>
